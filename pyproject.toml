[project]
name = "api-orquestador-multiagente"
version = "2.0.0"
description = "API FastAPI asincrona sobre un orquestador multi-agente LangGraph: Redis, Phoenix o LangSmith y aprobacion humana"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
