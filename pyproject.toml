[project]
name = "pipeline-extraccion-tecnica"
version = "1.0.0"
description = "Pipeline LCEL de extraccion de entidades tecnicas con salida validada por Pydantic"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3.60",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3"]
anthropic = ["langchain-anthropic>=0.3"]
gemini = ["langchain-google-genai>=2.1"]
all = ["langchain-openai>=0.3", "langchain-anthropic>=0.3", "langchain-google-genai>=2.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
