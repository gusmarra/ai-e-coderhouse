[project]
name = "agente-react-sqlite-langgraph"
version = "1.0.0"
description = "Agente de razonamiento ciclico (ReAct) con LangGraph, herramientas propias y memoria persistente en SQLite"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "aiosqlite>=0.20",
    "langchain-core>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=4"]
openai = ["langchain-openai>=1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
