[project]
name = "orquestador-multiagente-langgraph"
version = "1.0.0"
description = "Orquestador multi-agente jerarquico (Supervisor + Investigador + Analista) con LangGraph sobre la base del Hotel Bahia Serena"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
