[project]
name = "llm-client"
version = "1.0.0"
description = "Cliente LLM asincrono, multi-proveedor y validado con Pydantic"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.60"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
all = ["openai>=1.60", "anthropic>=0.40", "google-genai>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_client*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
